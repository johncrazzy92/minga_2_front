name: Frontend CI Pipeline

on:
  push:
    branches: [ "main", "master", "Minga_Final" ]
  pull_request:
    branches: [ "main", "master", "Minga_Final" ]

jobs:
  build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: http://localhost:8080
      VITE_GOOGLE_CLIENT_ID: mock-google-client-id

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Production Assets (Vite)
        run: npm run build
